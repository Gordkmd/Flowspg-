<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Flows PG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>💰 Flows PG</h1>
                <p>🔑 Reset Your Password</p>
            </div>
            
            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label>Email or Phone Number</label>
                    <input type="text" id="resetEmail" placeholder="Enter your registered email or phone" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Send Reset Link</button>
            </form>
            
            <div id="resetMessage" class="alert-info" style="display: none; margin-top: 15px; padding: 12px; border-radius: 10px; text-align: center;"></div>
            
            <p class="auth-link">Remember your password? <a href="login.html">Login here</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
