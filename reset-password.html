<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Flows PG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>💰 Flows PG</h1>
                <p>🔑 Create New Password</p>
            </div>
            
            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
            </form>
            
            <div id="resetSuccess" class="alert-success" style="display: none; margin-top: 15px; padding: 12px; border-radius: 10px; text-align: center;"></div>
            
            <p class="auth-link"><a href="login.html">Back to Login</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
