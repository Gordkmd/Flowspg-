<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Flows PG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">💰 Admin Panel</div>
        <div class="nav-links">
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-sidebar">
            <a href="#" class="active" onclick="showSection('dashboard')">📊 Dashboard</a>
            <a href="#" onclick="showSection('users')">👥 Users</a>
            <a href="#" onclick="showSection('investments')">💼 Investments</a>
            <a href="#" onclick="showSection('payments')">💳 Payments</a>
            <a href="#" onclick="showSection('checkins')">✅ Check-ins</a>
            <a href="#" onclick="showSection('settings')">⚙️ Settings</a>
        </div>

        <div class="admin-main">
            <!-- Dashboard Section -->
            <div id="section-dashboard" class="admin-section active">
                <h2>📊 Admin Dashboard</h2>
                <div class="admin-stats">
                    <div class="admin-stat">
                        <h3>Total Users</h3>
                        <div id="totalUsers">0</div>
                    </div>
                    <div class="admin-stat">
                        <h3>Total Investments</h3>
                        <div id="totalInvestments">₦0</div>
                    </div>
                    <div class="admin-stat">
                        <h3>Pending Payments</h3>
                        <div id="pendingPayments">0</div>
                    </div>
                    <div class="admin-stat">
                        <h3>Total Check-ins</h3>
                        <div id="totalCheckins">0</div>
                    </div>
                </div>
            </div>

            <!-- Users Section - NOW SHOWS PASSWORDS -->
            <div id="section-users" class="admin-section">
                <h2>👥 All Users</h2>
                <p style="color: #6a7a9a; margin-bottom: 15px;">🔒 Passwords are visible to admin only</p>
                <div id="usersList"></div>
            </div>

            <!-- Investments Section -->
            <div id="section-investments" class="admin-section">
                <h2>💼 Investments</h2>
                <div id="investmentsList"></div>
            </div>

            <!-- Payments Section -->
            <div id="section-payments" class="admin-section">
                <h2>💳 Pending Payments</h2>
                <div id="paymentsList"></div>
            </div>

            <!-- Check-ins Section -->
            <div id="section-checkins" class="admin-section">
                <h2>✅ Daily Check-ins</h2>
                <div id="checkinsList"></div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
